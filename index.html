<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  .selected {
    background: #2f5bd3;
    color: white;
  }

  .hit {
    color: green;
    font-weight: bold;
    background: #dcf3e8;
  }

  .safe {
    color: gray;
  }

  .note {
    display: block;       /* 次の行に表示する */
    font-size: 0.85em;    /* 少し小さく */
    font-weight: normal;  /* 太字を解除 */
    color: #b26a00;     /* オレンジ系 */
    margin-top: 2px;      /* 上の行との間を少し空ける */
  }

  button {
    font-size: 16px;            /* 文字を大きく */
    padding: 10px 16px;         /* 内側の余白（上下 10px、左右 16px） */
    min-height: 44px;           /* 最低でもこの高さにする */
    border: 1px solid #ccc;
    border-radius: 8px;         /* 角を丸く */
    background: white;
  }


  li {
    padding: 6px 8px;
    margin-bottom: 4px;
    border-radius: 6px;
    }
  ul {
    padding-left: 0;     /* 左の余白をなくす */
    list-style: none;    /* 行頭の「・」を消す */
    }
  
  select {
    font-size: 16px;
    min-height: 44px;
    padding: 0 8px;
    margin-bottom: 8px;
    }
</style>

<h1>確定反撃チェック</h1>
<select id="charSelect"></select>
<button id="filter"></button>
<ul id="list"></ul>
<script src="data.js"></script>


<script>

  const opts = [
    {name: "上B", f: 5},
    {name: "空上", f: 8},
    {name: "空N/空前", f: 9},
    {name: "つかみ", f: 10},
    {name: "弱", f: 16},
    {name: "上強", f: 17},
    {name: "下強", f: 18},
  ];

  let onlyHit = false;          // true なら確定ありだけ表示

  function withsign(n) {
    if (n >= 0) {return '+' + n}
    else {return n}
  }

  function get_punishes(adv) {
    const ok = [];
    for (const opt of opts) {
      if (opt.f < adv) {
        ok.push(opt.name);
      }
      if (opt.f === adv) {
        ok.push(opt.name + '(最速)')
      }
    }
    return ok;
  }

  function render(key) {
    select.value = key;
    const list = document.getElementById('list');
    list.innerHTML = "";

    for (const move of chars[key].moves) {
      const myadv = -move.adv
      const ok = get_punishes(myadv);

      if (onlyHit && ok.length === 0) {
        continue;
      }

      const li = document.createElement('li');
      let text = move.name + '(' + withsign(myadv) + 'F) : ';

      if (ok.length > 0) {
        li.classList.add('hit');
        text += ok.join('・') + 'が確定反撃';
      }
      else {
        li.classList.add('safe');
        text += '確定反撃なし';
      }
      li.textContent = text;
      if (move.note) {
        const note = document.createElement('span');
        note.classList.add('note');
        note.textContent = '補足 : ' + move.note;
        li.appendChild(note);
      }
      list.appendChild(li);  // id="list" の中に追加
    }
  };

  function filtering() {
    onlyHit = !onlyHit;
    filt.classList.toggle('selected', onlyHit);
    render(select.value);
  };

  const select = document.getElementById('charSelect');

  for (const key in chars) {
    const option = document.createElement('option');
    option.value = key;
    option.textContent = chars[key].name;
    select.appendChild(option);
  }

  select.addEventListener('change',function() {render(select.value);});

  const filt = document.getElementById('filter');
  filt.textContent = '確定反撃だけ';
  filt.addEventListener('click', filtering);

  render('mario');


</script>
